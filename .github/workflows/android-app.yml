# Builds the RentalSawari Admin Android app (android/) and publishes the APK
# on the "android-app" release, at a link that never changes:
# https://github.com/anasshahzad101/rental-sawari/releases/download/android-app/RentalSawari-Admin.apk
#
# Run it from the Actions tab ("Android admin app" → Run workflow). It also
# runs by itself when android/ changes. The signing key comes from two
# repository secrets; see docs/admin/ANDROID.md.

name: Android admin app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Load the signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::The signing key secrets are not set yet, so this is only a test build (not published). See docs/admin/ANDROID.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          gradle "$TASK" --no-daemon -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }}
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Built $APK"
          cp "$APK" "$RUNNER_TEMP/RentalSawari-Admin.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RentalSawari-Admin-${{ steps.key.outputs.signed == 'true' && 'signed' || 'test' }}-${{ github.run_number }}
          path: ${{ runner.temp }}/RentalSawari-Admin.apk
          retention-days: 14

      - name: Publish on the android-app release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-app >/dev/null 2>&1; then
            gh release create android-app --title "RentalSawari Admin for Android" --latest=false \
              --notes "Install on your Android phone: open this page on the phone, tap RentalSawari-Admin.apk, then Install. The app opens rentalsawari.com/admin; it updates itself with the website."
          fi
          gh release upload android-app "$RUNNER_TEMP/RentalSawari-Admin.apk" --clobber
          echo "### APK ready (version 1.${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/download/android-app/RentalSawari-Admin.apk" >> "$GITHUB_STEP_SUMMARY"
